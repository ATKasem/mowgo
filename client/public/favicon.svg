    <circle cx="25" cy="30" r="3"/>
    <!-- Grass -->
    <line x1="8" y1="34" x2="8" y2="38" opacity="0.5"/>
    <line x1="13" y1="34" x2="12" y2="39" opacity="0.5"/>
    <line x1="18" y1="34" x2="18" y2="38" opacity="0.5"/>
    <line x1="23" y1="34" x2="24" y2="39" opacity="0.5"/>
  </g>
</svg>
