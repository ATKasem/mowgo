  </defs>
  <rect width="48" height="48" rx="10" fill="url(#bg)"/>
  <g transform="translate(8,6)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mower body -->
