    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "MowGo",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, iOS, Android (PWA)",
          "description": "Scheduling, routing, and invoicing software for lawn care crews. Rain delay auto-reschedule included on the free tier.",
          "offers": [
            { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Solo", "price": "39", "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Crew", "price": "79", "priceCurrency": "USD" }
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            { "@type": "Question", "name": "Is MowGo really free?", "acceptedAnswer": { "@type": "Answer", "text": "Free for your first 5 clients, forever. No credit card. Rain delay, scheduling, and invoicing included." } },
            { "@type": "Question", "name": "What happens if I want to switch from Jobber or LawnPro?", "acceptedAnswer": { "@type": "Answer", "text": "On Solo and up, we import your clients and pre-schedule your first 30 days within 48 hours. Setup is limited to 20 new businesses per week." } },
            { "@type": "Question", "name": "Does MowGo work without cell service?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Offline mode keeps working in rural Oklahoma and syncs when you are back in range." } },
            { "@type": "Question", "name": "Why should I pay yearly?", "acceptedAnswer": { "@type": "Answer", "text": "Two months free ($78 off Solo, $158 off Crew) and one payment covers the whole season — no card hits in winter. The Rain-Proof Guarantee still applies: unused months are refunded." } },
            { "@type": "Question", "name": "What happens to my data if I cancel?", "acceptedAnswer": { "@type": "Answer", "text": "Your data stays yours, always. Export it anytime. If you cancel, we delete your data on request." } }
          ]
        }
      ]
    }
    </script>
