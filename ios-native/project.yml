name: MowGo
options:
  bundleIdPrefix: com.mowgo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  MowGo:
    type: application
    platform: iOS
    configFiles:
      Debug: MowGo/Config.xcconfig
      Release: MowGo/Config.xcconfig
    sources:
      - path: MowGo
    settings:
      base:
        INFOPLIST_FILE: MowGo/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MowGo
        INFOPLIST_KEY_CFBundleIdentifier: com.mowgo.app
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mowgo.app
        # Credentials — leave empty for CI (app runs in demo mode)
        INFOPLIST_KEY_SUPABASE_URL: "https://vqgiynfrpsqddjrayczc.supabase.co"
        INFOPLIST_KEY_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZ2l5bmZycHNxZGRqcmF5Y3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk5OTg5NjcsImV4cCI6MjA1NTU3NDk2N30.FqF_BmD7r8qnggEeOGYVS0mWqKpHhRIN3hG-xLgZXFM"
        INFOPLIST_KEY_StripePublishableKey: "$(STRIPE_PUBLISHABLE_KEY)"
    dependencies:
      - package: stripe-ios
        product: StripePayments
      - package: stripe-ios
        product: StripePaymentSheet
packages:
  stripe-ios:
    url: https://github.com/stripe/stripe-ios.git
    from: 23.0.0
