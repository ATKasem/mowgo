name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios-native/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Diagnostic
        run: |
          echo "Runner: $(uname -a)"
          echo "Xcode: $(xcodebuild -version 2>&1 || echo 'not found')"
          sw_vers

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build (simulator)
        working-directory: ios-native
        run: |
          xcodebuild build \
            -project MowFlow.xcodeproj \
            -scheme MowFlow \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-native/build/Logs/Build/*.xcactivitylog
